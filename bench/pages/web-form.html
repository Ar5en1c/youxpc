<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact details</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:2rem;max-width:42rem}label{display:block;margin:.75rem 0 .25rem}input,select,button{font:inherit;padding:.4rem .7rem}button{margin:.25rem .25rem .25rem 0}.row{margin:1rem 0}</style>
</head>
<body data-page="web-form">
<main>
<h1>Contact details</h1>
<form id="f" autocomplete="off">
<label for="name">Name</label>
<input id="name" name="name" type="text" required>
<label for="email">Email</label>
<input id="email" name="email" type="email" required>
<div class="row"><button type="submit">Submit</button></div>
</form>
<p id="status" role="status"></p>
</main>
<script src="_common.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  rec({ event: 'submit', name: document.getElementById('name').value,
        email: document.getElementById('email').value });
  document.getElementById('status').textContent = 'Form submitted.';
});
</script>
</body>
</html>
