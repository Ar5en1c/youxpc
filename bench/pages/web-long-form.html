<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace registration</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:2rem;max-width:46rem}label{display:block;margin:.75rem 0 .25rem}input,select,button,textarea{font:inherit;padding:.4rem .7rem}button{margin:.25rem .25rem .25rem 0}.row{margin:1rem 0}table{border-collapse:collapse}td,th{padding:.35rem .8rem;border-bottom:1px solid #ddd;text-align:left}.inline{display:inline}[hidden]{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}.modal>div{background:#fff;padding:1.5rem;border-radius:8px;min-width:18rem}[role=tab][aria-selected=true]{font-weight:700;border-bottom:3px solid #333}</style>
</head>
<body data-page="web-long-form">
<main>
<h1>Workspace registration</h1>
<form id="f">
<label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="off">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="off">
<fieldset class="row"><legend>Role</legend>
<input id="r1" type="radio" name="role" value="Viewer" checked><label class="inline" for="r1">Viewer</label>
<input id="r2" type="radio" name="role" value="Editor"><label class="inline" for="r2">Editor</label>
<input id="r3" type="radio" name="role" value="Admin"><label class="inline" for="r3">Admin</label>
</fieldset>
<label for="team">Team</label>
<select id="team" name="team"><option value="">Choose a team</option><option>Billing</option><option>Design</option><option>Platform</option><option>Support</option></select>
<div class="row"><input id="summary" type="checkbox"><label class="inline" for="summary">Send weekly summary</label></div>
<div class="row"><input id="usage" type="checkbox" checked><label class="inline" for="usage">Share usage data</label></div>
<label for="notes">Notes</label><textarea id="notes" name="notes" rows="3" cols="40"></textarea>
<div class="row"><button type="submit">Register</button></div>
</form>
<p id="status" role="status"></p>
</main>
<script src="_common.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var role = document.querySelector('input[name=role]:checked');
  rec({ event: 'register', name: document.getElementById('name').value, email: document.getElementById('email').value,
        role: role ? role.value : '', team: document.getElementById('team').value,
        summary: document.getElementById('summary').checked, usage: document.getElementById('usage').checked,
        notes: document.getElementById('notes').value });
  document.getElementById('status').textContent = 'Registered.';
});
</script>
</body>
</html>
